<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civil Service Examination - Online Application Portal</title>
    <link rel="icon" href="../images/csclogo.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="header-with-logo">
                    <img src="../images/csc.svg" alt="CSC Logo" class="header-logo" />
                    <div>
                        <h1 class="header-title">Civil Service Examination</h1>
                        <p class="header-subtitle">Online Application Portal</p>
                    </div>
                </div>
                <button class="btn-sign-in">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span class="hide-mobile">Sign In</span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h2>Applicant Login</h2>
                    <p>Sign in using the account you created during your Civil Service Examination application.</p>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="email">
                            Email Address
                            <span class="required">*</span>
                        </label>
                        <input
                            type="email"
                            id="email"
                            class="form-input"
                            placeholder="Enter your email address"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">
                            Password
                            <span class="required">*</span>
                        </label>
                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="Enter your password"
                            required
                        >
                    </div>
                    <button
                        type="submit"
                        class="btn-login"
                    >
                        Sign In
                    </button>
                </form>
                <div class="login-footer">
                    <p>Don't have an account?
                        <a href="application.html">
                        Apply for Examination
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </main>
    <script src="loginPage.js"></script>
</body>
