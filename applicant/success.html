<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Application Submitted</title>

<link rel="stylesheet" href="../css/style.css">

<style>

body{
    background:#f4f6f9;
    font-family:Arial,sans-serif;
    margin:0;
    padding:40px 20px;
}

.success-container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:50px;
    border-radius:16px;
    box-shadow:0 8px 25px rgba(0,0,0,.1);
    text-align:center;
}

.success-icon{
    font-size:70px;
    color:#198754;
}

h1{
    color:#198754;
    margin-bottom:10px;
}

.info-box{
    margin-top:30px;
    text-align:left;
}

.info-row{
    display:grid;
    grid-template-columns:250px 1fr;
    margin-bottom:15px;
}

.label{
    font-weight:bold;
}

.value{
    color:#333;
}

.btn-home{
    margin-top:40px;
    background:#0038A8;
    color:white;
    border:none;
    padding:12px 24px;
    border-radius:8px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="success-container">

    <div class="success-icon">✔</div>

    <h1>Application Submitted Successfully</h1>

    <p>
        Your Civil Service Examination application
        has been successfully recorded.
    </p>

    <div class="info-box">

        <div class="info-row">
            <div class="label">Application Number</div>
            <div class="value" id="applicationNumber"></div>
        </div>

        <div class="info-row">
            <div class="label">Assigned Examination Date</div>
            <div class="value" id="examDate"></div>
        </div>

        <div class="info-row">
            <div class="label">Registered Email Address</div>
            <div class="value" id="emailAddress"></div>
        </div>

    </div>

    <button
        class="btn-home"
        onclick="window.location.href='../index.html'">
        Return to Home
    </button>

</div>

<script>

document.getElementById("applicationNumber")
.textContent =
localStorage.getItem("application_number");

document.getElementById("examDate")
.textContent =
localStorage.getItem("exam_date");

document.getElementById("emailAddress")
.textContent =
localStorage.getItem("account_email");

</script>

</body>
</html>
