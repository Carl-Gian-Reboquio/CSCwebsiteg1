<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        body{
            background:#f4f6f9;
            font-family:Arial, sans-serif;
            margin:0;
            padding:40px 20px;
        }

        .form-container{
            max-width:850px;
            margin:auto;
            background:white;
            padding:40px;
            border-radius:16px;
            box-shadow:0 8px 25px rgba(0,0,0,.1);
        }

        h2{
            color:#0038A8;
            margin-bottom:30px;
        }

        h3{
            margin-top:35px;
            color:#0038A8;
            border-bottom:2px solid #eee;
            padding-bottom:8px;
        }

        .form-group{
            margin-bottom:18px;
        }

        .form-group label{
            display:block;
            margin-bottom:6px;
            font-weight:600;
        }
        

.otherPwd{
    margin-top:8px;
}

        .form-group input,
        .form-group select,
        .form-group textarea{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            box-sizing:border-box;
        }

        .radio-group{
            display:flex;
            gap:20px;
            margin-top:5px;
        }

        .radio-group label{
            font-weight:normal;
        }

        .button-row{
            display:flex;
            justify-content:space-between;
            margin-top:40px;
        }

        .btn{
            padding:12px 24px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            color:white;
            font-size:15px;
        }

        #pwdSection label{
        display:block;
        margin-bottom:8px;
        font-weight:normal;
        }

        #pwdSection input[type="checkbox"]{
        width:auto;
        margin-right:8px;
        }

        .btn-back{
            background:#6c757d;
        }

        .btn-next{
            background:#0038A8;
        }

    </style>
</head>
<body>

<form class="form-container" id="personalInfoForm">

    <h2>Personal Information</h2>

    <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="lastName" required>
    </div>

    <div class="form-group">
        <label>First Name</label>
        <input type="text" id="firstName" required>
    </div>

    <div class="form-group">
        <label>Middle Name</label>
        <input type="text" id="middleName">
    </div>

    <div class="form-group">
        <label>Suffix</label>
        <input type="text" id="suffix" placeholder="Jr., Sr., III">
    </div>

    <div class="form-group">
        <label>Sex</label>
        <select id="sex" required>
            <option value="">Select Sex</option>
            <option>Male</option>
            <option>Female</option>
        </select>
    </div>

    <div
    class="form-group"
    id="pregnantSection"
    style="display:none;">

    <label>Are you pregnant?</label>

        <div class="radio-group">

            <label>
                <input
                    type="radio"
                    name="pregnant"
                    value="Yes">
                Yes
            </label>

            <label>
                <input
                    type="radio"
                    name="pregnant"
                    value="No"
                    checked>
                No
            </label>

        </div>

    </div>

    <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="birthDate" required>
    </div>

    <div class="form-group">
        <label>Age</label>
        <input type="number" id="age" readonly>
    </div>

    <div class="form-group">
        <label>Place of Birth</label>
        <input type="text" id="placeOfBirth" required>
    </div>

    <div class="form-group">
        <label>Civil Status</label>
        <select id="civilStatus" required>
            <option value="">Select Civil Status</option>
            <option>Single</option>
            <option>Married</option>
            <option>Widowed</option>
            <option>Separated</option>
        </select>
    </div>

    <div class="form-group">
        <label>Citizenship</label>
        <select id="citizenship">
            <option>Filipino</option>
            <option>Dual Citizen</option>
            <option>Other</option>
        </select>
    </div>

    <h3>Contact Information</h3>

    <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="mobileNumber" required>
    </div>

    <div class="form-group">
        <label>Telephone Number</label>
        <input type="tel" id="telephoneNumber">
    </div>

    <h3>Permanent Address</h3>

    <div class="form-group">
        <label>Complete Address</label>
        <textarea id="address" rows="4" required></textarea>
    </div>

    <div class="form-group">
        <label>ZIP Code</label>
        <input type="text" id="zipCode" required>
    </div>

    <h3>Other Information</h3>

    <div class="form-group">
        <label>Person With Disability (PWD)?</label>

        <div class="radio-group">
            <label>
                <input type="radio" name="pwd" id="pwdYes" value="Yes">
                Yes
            </label>

            <label>
                <input type="radio" name="pwd" id="pwdNo" value="No" checked>
                No
            </label>
        </div>
    </div>

    <div class="form-group">
    <label>PWD Type</label>

    <div id="pwdSection" style="opacity:.5; pointer-events:none;">

        <label>
            <input type="checkbox" class="pwd-checkbox" value="Orthopedic Disability">
            Orthopedic Disability
        </label>

        <label>
            <input type="checkbox" class="pwd-checkbox" value="Visual Disability">
            Visual Disability
        </label>

        <label>
            <input type="checkbox" class="pwd-checkbox" value="Hearing Disability">
            Hearing Disability
        </label>

        <label>
            <input type="checkbox" class="pwd-checkbox" value="Speech Impairment">
            Speech Impairment
        </label>



        <div id="otherPwdContainer">

            <label>Other Disability Type</label>

            <input
                type="text"
                class="otherPwd"
                placeholder="Specify disability">

        </div>

        <br>

        <button
            type="button"
            id="addOtherPwd"
            style="
                background:#0038A8;
                color:white;
                border:none;
                padding:8px 14px;
                border-radius:6px;
                cursor:pointer;">
            + Add Another Other Type
        </button>

    </div>

    </div>

    <div class="form-group">
        <label>Senior Citizen?</label>

        <div class="radio-group">
            <label>
                <input type="radio" name="senior" value="yes">
                Yes
            </label>

            <label>
                <input type="radio" name="senior" value="no" checked>
                No
            </label>
        </div>
    </div>

    <h3>Family Information</h3>

    <div class="form-group">
        <label>Mother's Maiden Name</label>
        <input type="text" id="motherMaidenName" required>
    </div>

    <div class="button-row">

        <button
            type="button"
            class="btn btn-back"
            onclick="window.location.href='examdetails.html'">
            Back
        </button>

        <button
            type="submit"
            class="btn btn-next">
            Next
        </button>

    </div>

</form>

<script>

const birthDate = document.getElementById("birthDate");
const age = document.getElementById("age");

birthDate.addEventListener("change", () => {

    const dob = new Date(birthDate.value);
    const today = new Date();

    let years =
        today.getFullYear() -
        dob.getFullYear();

    const monthDiff =
        today.getMonth() -
        dob.getMonth();

    if (
        monthDiff < 0 ||
        (
            monthDiff === 0 &&
            today.getDate() < dob.getDate()
        )
    ){
        years--;
    }

    age.value = years;
});

const sex = document.getElementById("sex");
const pregnantSection = document.getElementById("pregnantSection");

sex.addEventListener("change", () => {

    if(sex.value === "Female"){

        pregnantSection.style.display = "block";

    }else{

        pregnantSection.style.display = "none";

        document.querySelector(
            'input[name="pregnant"][value="No"]'
        ).checked = true;

    }

});

const pwdYes =
    document.getElementById("pwdYes");

const pwdNo =
    document.getElementById("pwdNo");

const pwdSection =
    document.getElementById("pwdSection");

pwdYes.addEventListener("change", () => {

    pwdSection.style.opacity = "1";
    pwdSection.style.pointerEvents = "auto";

});

pwdNo.addEventListener("change", () => {

    pwdSection.style.opacity = ".5";
    pwdSection.style.pointerEvents = "none";

    document
        .querySelectorAll(".pwd-checkbox")
        .forEach(cb => cb.checked = false);

    document
        .querySelectorAll(".otherPwd")
        .forEach((box, index) => {

            if(index === 0){
                box.value = "";
            }else{
                box.remove();
            }

        });
    

});

const addOtherPwd =
    document.getElementById("addOtherPwd");

const otherPwdContainer =
    document.getElementById("otherPwdContainer");

addOtherPwd.addEventListener("click", () => {

    const input =
        document.createElement("input");

    input.type = "text";
    input.className = "otherPwd";
    input.placeholder = "Specify disability";

    otherPwdContainer.appendChild(input);

});

document
.getElementById("personalInfoForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    localStorage.setItem(
        "last_name",
        document.getElementById("lastName").value
    );

    localStorage.setItem(
        "first_name",
        document.getElementById("firstName").value
    );

    localStorage.setItem(
        "middle_name",
        document.getElementById("middleName").value
    );

    localStorage.setItem(
        "suffix",
        document.getElementById("suffix").value
    );

    localStorage.setItem(
        "sex",
        document.getElementById("sex").value
    );

    let pregnant = "No";

    if(document.getElementById("sex").value === "Female"){

        pregnant =
            document.querySelector(
                'input[name="pregnant"]:checked'
            ).value;

    }

    localStorage.setItem(
    "pregnant",
    pregnant
    );

    localStorage.setItem(
        "birth_date",
        document.getElementById("birthDate").value
    );

    localStorage.setItem(
        "age",
        document.getElementById("age").value
    );

    localStorage.setItem(
        "place_of_birth",
        document.getElementById("placeOfBirth").value
    );

    localStorage.setItem(
        "civil_status",
        document.getElementById("civilStatus").value
    );

    localStorage.setItem(
        "citizenship",
        document.getElementById("citizenship").value
    );

    localStorage.setItem(
        "mobile_number",
        document.getElementById("mobileNumber").value
    );

    localStorage.setItem(
        "telephone_number",
        document.getElementById("telephoneNumber").value
    );

    localStorage.setItem(
        "address",
        document.getElementById("address").value
    );

    localStorage.setItem(
        "zip_code",
        document.getElementById("zipCode").value
    );

    localStorage.setItem(
        "mother_maiden_name",
        document.getElementById("motherMaidenName").value
    );

    localStorage.setItem(
        "pwd",
        pwdYes.checked ? "Yes" : "No"
    );

    localStorage.setItem(
        "senior_citizen",
        document.querySelector('input[name="senior"]:checked').value
    );

    const pwdTypes = [];

    document
        .querySelectorAll(".pwd-checkbox:checked")
        .forEach(cb => {
            pwdTypes.push(cb.value);
        });

    document
        .querySelectorAll(".otherPwd")
        .forEach(box => {

            if(box.value.trim() !== ""){
                pwdTypes.push(box.value.trim());
            }

        });

    localStorage.setItem(
        "pwd_types",
        JSON.stringify(pwdTypes)
    );

    window.location.href = "educwork.html";

});

</script>

</body>
</html>
