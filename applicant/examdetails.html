<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Examination Details</title>

    <link rel="stylesheet" href="../css/form.css">
</head>

<body>

<div class="form-page">

    <div class="form-card">

        <h2>Examination Details</h2>
        <p class="form-subtitle">Fill out your exam preferences</p>

        <div class="form-group">
            <label>CSC Regional Office</label>
            <select id="region">
                <option value="">Select Region</option>
                <option value="NCR">NCR</option>
                <option value="CAR">CAR</option>
                <option value="Region I">Region I</option>
                <option value="Region II">Region II</option>
                <option value="Region III">Region III</option>
                <option value="Region IV-A / IV-B">Region IV-A / IV-B</option>
                <option value="Region V">Region V</option>
                <option value="Region VI">Region VI</option>
                <option value="Region VII">Region VII</option>
                <option value="Region VIII">Region VIII</option>
                <option value="Region IX">Region IX</option>
                <option value="Region X">Region X</option>
                <option value="Region XI">Region XI</option>
                <option value="Region XII">Region XII</option>
                <option value="Caraga">Caraga</option>
                <option value="BARMM">BARMM</option>
            </select>
        </div>

        <div class="form-group">
                <label>Examination Applied For</label>
                <select id="examType">
                <option>Professional</option>
                <option>Subprofessional</option>
            </select>
        </div>

        <div class="form-group">
            <label>Place of Examination</label>
            <select id="examPlace">
                <option value="">Select Region First</option>
            </select>
        </div>

        <div class="form-group">
            <label>First-Time Taker?</label>

            <label>
    <input
        type="radio"
        id="firstTimeYes"
        name="taker"
        value="Yes">
    Yes
</label>

<label>
    <input
        type="radio"
        id="firstTimeNo"
        name="taker"
        value="No">
    No
</label>
        </div>

        <div class="form-group" id="lastExam" style="display:none;">
            <label>Date of Last Examination Taken</label>
            <input type="date" id="lastExamDate">
        </div>

        <div class="form-actions">
            <a class="btn-back" href="../index.html">Back</a>

            <button
                type="button"
                class="btn-next"
                id="nextBtn"
                onclick="window.location.href='personalinfo.html'">
                Next
            </button>
        </div>

    </div>

</div>

<script>
const examCenters = {
    "NCR": ["Quezon City","Makati City","Pasay City","Taguig City","Manila","Caloocan City"],
    "CAR": ["Baguio City","La Trinidad","Bangued","Tabuk City","Bontoc","Lamut"],
    "Region I": ["San Fernando City","Vigan City","Candon City","Laoag City","Urdaneta City","Lingayen"],
    "Region II": ["Tuguegarao City","Cauayan City","Bayombong","Diffun"],
    "Region III": ["City of San Fernando","Malolos City","Cabanatuan City","Balanga City","Baler","Tarlac City"],
    "Region IV-A / IV-B": ["Imus City","Sta. Cruz","Batangas City","Morong","Lucena City","Puerto Princesa City"],
    "Region V": ["Legazpi City","Daet","Naga City","Pili","Sorsogon City","Virac"],
    "Region VI": ["Iloilo City","Bacolod City","Roxas City","Kalibo","San Jose","Jordan"],
    "Region VII": ["Cebu City","Lapu-Lapu City","Dumaguete City","Bayawan City","Tagbilaran City","Larena"],
    "Region VIII": ["Tacloban City","Maasin City","Catbalogan City","Borongan City","Catarman","Naval"],
    "Region IX": ["Zamboanga City","Pagadian City","Dipolog City"],
    "Region X": ["Cagayan de Oro City","Iligan City","Valencia City","Mambajao"],
    "Region XI": ["Davao City","Digos City","Tagum City","Mati City","Nabunturan"],
    "Region XII": ["Koronadal City","General Santos City","Kidapawan City","Tacurong City"],
    "Caraga": ["Butuan City","Cabadbaran City","Surigao City","Tandag City"],
    "BARMM": ["Cotabato City","Jolo","Bongao"]
};

/* ---------------------------
   ELEMENTS
---------------------------- */
const region = document.getElementById("region");
const examType = document.getElementById("examType");
const examPlace = document.getElementById("examPlace");

const firstYes = document.getElementById("firstTimeYes");
const firstNo = document.getElementById("firstTimeNo");
const lastExam = document.getElementById("lastExam");
const lastExamDate = document.getElementById("lastExamDate");

const nextBtn = document.getElementById("nextBtn");

/* ---------------------------
   REGION → CITY DROPDOWN
---------------------------- */
region.addEventListener("change", function () {

    examPlace.innerHTML =
        '<option value="">Select Place of Examination</option>';

    if (!this.value) return;

    examCenters[this.value].forEach(city => {
        const opt = document.createElement("option");
        opt.value = city;
        opt.textContent = city;
        examPlace.appendChild(opt);
    });
});

/* ---------------------------
   FIRST TIME TOGGLER
---------------------------- */
firstYes.addEventListener("change", () => {
    lastExam.style.display = "none";
    lastExamDate.value = "";
});

firstNo.addEventListener("change", () => {
    lastExam.style.display = "block";
});

/* ---------------------------
   NEXT BUTTON + SAVE DATA
---------------------------- */
nextBtn.addEventListener("click", () => {

    const firstTaker =
        document.querySelector('input[name="taker"]:checked');

    localStorage.setItem(
    "exam_region",
    region.value
);

localStorage.setItem(
    "exam_type",
    examType.value
);

localStorage.setItem(
    "exam_place",
    examPlace.value
);

localStorage.setItem(
    "exam_first_taker",
    firstTaker ? firstTaker.value : ""
);

localStorage.setItem(
    "exam_last_date",
    lastExamDate.value
);

    window.location.href = "personalinfo.html";
});
</script>

</body>
</html>
